appId: com.anjuyunshu.property
productName: 安居云枢物业工作台
artifactName: Anju-Property-Windows-${version}-Setup.${ext}
directories:
  output: output/installers/windows
files:
  - apps/desktop/**/*
  - package.json
asar: true
compression: maximum
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: 安居云枢网页端(1)/textcursor/assets/logo.png
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 安居云枢物业工作台
  uninstallDisplayName: 安居云枢物业工作台
  installerLanguages:
    - zh_CN
  language: 2052
