  <main id="main">
    <div class="container page-hero">
      <h1>隐患上报 / 联系物业</h1>
      <p>填写位置与情况，我们会在 1 个工作日内回复处理进度。</p>
    </div>

    <section class="section">
      <div class="container narrow">
        <form class="report-form" id="report-form" novalidate>
          <div class="form-row">
            <label for="location">位置 <span>*</span></label>
            <input id="location" name="location" type="text" placeholder="例如：3号楼2单元楼梯间" required />
          </div>

          <div class="form-row">
            <label for="type">隐患类型 <span>*</span></label>
            <select id="type" name="type" required>
              <option value="">请选择</option>
              <option>占用消防车通道 / 疏散通道</option>
              <option>消防设施损坏或缺件</option>
              <option>电动车违规停放充电</option>
              <option>常闭防火门常开 / 损坏</option>
              <option>其他</option>
            </select>
          </div>

          <div class="form-row">
            <label for="desc">情况描述 <span>*</span></label>
            <textarea id="desc" name="desc" rows="4" placeholder="请简要说明发现时间与现场情况" required></textarea>
          </div>

          <div class="form-row two-col">
            <div>
              <label for="name">联系人</label>
              <input id="name" name="name" type="text" placeholder="选填" />
            </div>
            <div>
              <label for="phone">联系电话 <span>*</span></label>
              <input id="phone" name="phone" type="tel" placeholder="便于回访" required />
            </div>
          </div>

          <div class="form-row">
            <label for="photo">现场照片（演示）</label>
            <input id="photo" name="photo" type="file" accept="image/*" />
            <p class="field-hint">本地预览版仅前端校验与成功提示，不会上传服务器。后续可对接后端 API 或邮箱（mailto）。</p>
          </div>

          <button class="btn btn-primary btn-block" type="submit">提交上报</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>

        <div style="margin-top:1.5rem">
          <h2 style="margin:0 0 0.5rem;font-size:1.1rem;">其他联系方式</h2>
          <p style="margin:0;color:var(--muted)">物业消防值班：<a class="phone" href="tel:4008009000">400-800-9000</a></p>
          <p style="margin:0.35rem 0 0;color:var(--muted)">生命危险请立即拨打 <a class="phone" href="tel:119">119</a>，再通知物业。</p>
        </div>
      </div>
    </section>
  </main>
